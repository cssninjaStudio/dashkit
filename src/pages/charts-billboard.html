---
layout: default
title: Billboard JS
---

<!-- Main dashboard container -->
<div
  id="dashboard-wrapper"
  class="dashboard-outer"
  x-data="initBillboardCharts()"
  :class="{
    'is-pushed': $store.app.sidebarOpenedState,
    '': !$store.app.sidebarOpenedState
}"
>
  <div class="dashboard-inner">
    <!-- Dashboard Wrapper -->
    <div class="dashboard-wrapper">
      <div id="main-dashboard" class="section-wrapper">
        <!-- Dashboard content -->
        <div class="dashboard-columns">
          <div class="columns is-multiline">
            <!--Logo Card-->
            <div class="column is-4">
              <div class="widget logo-widget">
                <div class="lib-logo">
                  <img
                    class="light-image-block"
                    src="/img/logo/stacks/billboard.svg"
                    alt=""
                  />
                  <img
                    class="dark-image-block"
                    src="/img/logo/stacks/billboard-dark.svg"
                    alt=""
                  />
                </div>
                <div class="logo-card-content">
                  <div class="lib-name">Billboard JS</div>
                  <div class="subname">Javascript charting library</div>
                </div>
                <div class="filigrane"><i class="sl icon-pie-chart"></i></div>
              </div>
            </div>

            <!--Billboard Line Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Line Chart</h3>
                </div>
                <div id="billboardLineChart"></div>
              </div>
            </div>

            <!--Billboard Line Regions Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Line Regions</h3>
                </div>
                <div id="billboardLineRegionsChart"></div>
              </div>
            </div>

            <!--Billboard Area Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Area Chart</h3>
                </div>
                <div id="billboardAreaChart"></div>
              </div>
            </div>

            <!--Billboard Area Range Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Area Range</h3>
                </div>
                <div id="billboardAreaRangeChart"></div>
              </div>
            </div>

            <!--Billboard Bar Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Bar Chart</h3>
                </div>
                <div id="billboardBarChart"></div>
              </div>
            </div>

            <!--Billboard Stacked Bar Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Bar Stacked</h3>
                </div>
                <div id="billboardBarStackedChart"></div>
              </div>
            </div>

            <!--Billboard Step Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Step Chart</h3>
                </div>
                <div id="billboardStepChart"></div>
              </div>
            </div>

            <!--Billboard Spline Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Spline Chart</h3>
                </div>
                <div id="billboardSplineChart"></div>
              </div>
            </div>

            <!--Billboard Bubble Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Bubble Chart</h3>
                </div>
                <div id="billboardBubbleChart"></div>
              </div>
            </div>

            <!--Billboard Scatter Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Scatter Chart</h3>
                </div>
                <div id="billboardScatterChart"></div>
              </div>
            </div>

            <!--Billboard Pie Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Pie Chart</h3>
                </div>
                <div id="billboardPieChart"></div>
              </div>
            </div>

            <!--Billboard Donut Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Donut Chart</h3>
                </div>
                <div id="billboardDonutChart"></div>
              </div>
            </div>

            <!--Billboard Gauge Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Gauge Chart</h3>
                </div>
                <div id="billboardGaugeChart"></div>
              </div>
            </div>

            <!--Billboard Radar Chart-->
            <div class="column is-4">
              <div class="flex-card p-4">
                <div class="card-head p-4 is-spaced">
                  <h3>Radar Chart</h3>
                </div>
                <div id="billboardRadarChart"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
